services:
  mysql:
    image: mysql:8.4
    container_name: w9-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-w9}
      MYSQL_USER: ${MYSQL_USER:-w9}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-w9secret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - w9-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uw9', '-pw9secret']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    container_name: w9-backend
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: mysql://${MYSQL_USER:-w9}:${MYSQL_PASSWORD:-w9secret}@mysql:3306/${MYSQL_DATABASE:-w9}
      JWT_SECRET: ${JWT_SECRET:-w9-dev-secret-change-me}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    container_name: w9-frontend
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  w9-mysql-data:
