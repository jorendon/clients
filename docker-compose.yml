services:
  mysql:
    image: mysql:8.4
    container_name: clients-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clients}
      MYSQL_USER: ${MYSQL_USER:-clients}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clientssecret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - clients-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uclients', '-pclientssecret']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    container_name: clients-backend
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: mysql://${MYSQL_USER:-clients}:${MYSQL_PASSWORD:-clientssecret}@mysql:3306/${MYSQL_DATABASE:-clients}
      JWT_SECRET: ${JWT_SECRET:-clients-dev-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      HASH_SALT: ${HASH_SALT}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    container_name: clients-frontend
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  clients-mysql-data:
